<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>Arrow Puzzle</h1>
            <h2 id="level-indicator">Level 1</h2>
        </header>

        <div id="grid">
            <!-- Blocks will be generated here -->
        </div>

        <div id="win-message" class="hidden">
            <h2>Level Cleared!</h2>
            <button id="next-level-btn">Next Level</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
